# Il controllo di salute di Docker (wget dal container stesso verso 127.0.0.1, ogni minuto)
# non va nel log: così nel log del container, e nella pagina del guardiano, restano solo
# le visite vere, che arrivano da altri indirizzi (rete Docker o LAN)
map $remote_addr $morse_registra {
    127.0.0.1 0;
    default   1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirect con indirizzo relativo: mantiene la porta (8095) e il nome usati dal browser
    absolute_redirect off;
    server_tokens off;
    access_log /var/log/nginx/access.log main if=$morse_registra;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        # Sempre la versione più recente dopo un aggiornamento dal Pi
        add_header Cache-Control "no-cache";
        # Tutto gira nel browser: nessuna richiesta verso altri indirizzi
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
