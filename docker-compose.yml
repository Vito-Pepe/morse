services:
  morse:
    build: .
    ports:
      # Raggiungibile dalla LAN (http://IP-DEL-PI:8095) e dalla tailnet
      # (https://morse.<tailnet>.ts.net dalla repo ingressi-https). Mai su Internet.
      # Le porte 8080-8094 sono già usate da altre app sul Pi (INFRASTRUTTURA-PI.md di sillabe).
      - "8095:80"
    # Pagine statiche: il container non scrive niente, tranne i file temporanei di nginx
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Servono solo a nginx per avviare i processi con l'utente "nginx"
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    # Se nginx non risponde per 3 controlli di fila, Docker segna il container "unhealthy"
    # e il guardiano del Pi (repo guardiano) lo riavvia
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
